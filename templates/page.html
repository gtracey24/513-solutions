  <main id="content" class="px-3 px-md-0">

  <!-- 
  {{PARTIAL_FOOTER}} -->

  <!--CARD COLOR CHANGE-->
  <script>

    document.addEventListener("DOMContentLoaded", () => {
      const allCards = document.querySelectorAll('service-card');

    allCards.forEach((card, i) => {
      let colorIndex = i % cardShadowArray.length
      card.style.boxShadow = `0 0 20px ${cardShadowArray[colorIndex]}`;
    });
    });
    
  </script>
