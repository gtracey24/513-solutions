<section id="vacancies" class="py-6"
  style="
    background: linear-gradient(135deg, #2e8b8f, #4fb3bf);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  ">

  <div class="vacancies-wide" style="width:100%; max-width:1400px; margin:0 auto; text-align:center;">

    <h2 class="vacancies-title" style="font-size:2.8rem; font-weight:700; margin-bottom:25px;">
      {{SECTION_TITLE}}
    </h2>

    <div class="vacancies-embed">

      <script type='text/javascript' charset='utf-8'>
        document.write(unescape("%3Cscript src='" + 
          (('https:' == document.location.protocol) ? 'https:' : 'http:') + 
          "//fiveonethreesolutions.appfolio.com/javascripts/listing.js' type='text/javascript'%3E%3C/script%3E"));
      </script>

      <script type='text/javascript' charset='utf-8'>
        Appfolio.Listing({
          hostUrl: 'fiveonethreesolutions.appfolio.com',
          themeColor: '#676767',
          height: '600px',
          width: '100%',
          defaultOrder: 'date_posted'
        });
      </script>

    </div>

  </div>

</section>
